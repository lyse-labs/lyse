# Ecosystem diff — builds the CLI from the PR's merge base and from the PR head,
# runs both over the same pinned third-party repositories, and reports every
# behavioural difference to the job summary.
#
# Deliberately NOT a required check and deliberately never failing on a diff: a
# behaviour change is information, not a verdict, and a human decides whether it
# is an improvement. It fails only when it could not do its job at all.
#
# It complements `bench-golden` rather than replacing it. A committed snapshot
# is an artefact that goes stale, and whoever's PR turns it red is the person
# who regenerates it — reviewable at four repos, a rubber stamp at thirteen.
# This has no artefact to regenerate: the only way to make the diff empty is to
# not change behaviour.
name: Ecosystem diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  ecosystem-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: detect
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}" HEAD \
               | grep -qE '^(packages/core/|scripts/ecosystem-diff/|\.github/workflows/ecosystem-diff\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No packages/core changes — ecosystem diff skipped."
          fi
      - if: steps.detect.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with: { version: 9.12.0 }
      - if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - if: steps.detect.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.run == 'true'
        run: pnpm -F lyse build
      - name: Run ecosystem diff
        if: steps.detect.outputs.run == 'true'
        env:
          BASELINE_REF: origin/${{ github.base_ref }}
        run: |
          set -o pipefail
          pnpm ecosystem:diff --markdown | tee ecosystem-diff.md
          cat ecosystem-diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ecosystem-diff
          path: ecosystem-diff.md
          retention-days: 14
